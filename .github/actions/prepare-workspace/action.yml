name: Prepare workspace
description: Check out and prepare the repository workspace environment
runs:
  using: composite
  steps:
  - uses: pnpm/action-setup@v4
    with:
      run-install: false
  - uses: actions/setup-node@v4
    with:
      node-version: 18
      cache: pnpm
  - shell: bash
    run: pnpm install --frozen-lockfile
