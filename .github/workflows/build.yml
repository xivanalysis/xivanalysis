name: Build
on:
  pull_request: {}
  # TODO: need a push here too

permissions:
  checks: write

jobs:
  gate:
    if: github.repository_owner == 'xivanalysis'
    runs-on: ubuntu-latest
    steps:
    - run: echo "running on upstream repository"

  lint:
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/prepare-workspace
    - run: yarn lint --format=compact

  typecheck:
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/prepare-workspace
    - run: yarn types

  check-extract:
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/prepare-workspace
    - run: bash ./.github/scripts/check-extract.sh

  test:
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/prepare-workspace
    # TODO: swap this to `--reporters=github-actions` and remove this
    # package once jest is targeting >28
    - run: yarn test --reporters=jest-github-actions-reporter

  # TODO: ok everything from this point on should only execute for actual merges
  build:
    runs-on: ubuntu-latest
    needs:
    - lint
    - typecheck
    - check-extract
    - test
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/prepare-workspace
    # Build
    - name: build
      run: |
        yarn extract
        export REACT_APP_VERSION=$GITHUB_RUN_NUMBER
        export REACT_APP_GIT_COMMIT=$(git rev-parse --short HEAD)
        export REACT_APP_GIT_BRANCH=$GITHUB_REF_NAME
        CI=false NODE_ENV=production yarn build
    - uses: actions/upload-artifact@v4
      with:
        name: dist-client
        path: build
        retention-days: 7
  
  # This is seperated out such that it can be re-run seperately to the rest of the build.
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    # Deploy
    - uses: actions/download-artifact@v4
      with:
        name: dist-client
        path: build
    - name: set environment
      run: |
        BUILD_ID="${{ github.ref_name }}.${{ github.sha }}"
        echo "BUILD_ID=${BUILD_ID/\//_}" >> "$GITHUB_ENV"
    - name: prepare payload
      run: |
        mv build $BUILD_ID
        tar -czf $BUILD_ID.tgz $BUILD_ID
    - name: connect to tailnet
      uses: tailscale/github-action@v2
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:xivanalysis
    - name: upload
      run: scp -4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $BUILD_ID.tgz xivanalysis@xivanalysis.neko-tawny.ts.net:client/deploy-cache
    # ain't no deploy script there yet
    # todo also like, vars for the stuff above
